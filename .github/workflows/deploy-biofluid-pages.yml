name: Deploy Biofluid Health Monitor

on:
  push:
    branches:
      - main
    paths:
      - "biofluid-health-monitor/**"
      - ".github/workflows/deploy-biofluid-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Biofluid app
        uses: actions/upload-pages-artifact@v3
        with:
          path: biofluid-health-monitor

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
